name: debug-backend-build
on: [push, workflow_dispatch]
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image under a Render-like 512MB memory limit
        run: docker build --memory=512m --memory-swap=512m -f backend/Dockerfile -t debug-backend backend
